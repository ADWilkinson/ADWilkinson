name: link-check

# The profile README is this repository's only asset and its value is outbound-link
# reachability. This workflow is the regression guard: a red run means a real dead
# link, and the fix belongs in README.md, not in this config.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/link-check.yml
  pull_request:
    paths:
      - README.md
      - .github/workflows/link-check.yml
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # No --cache / .lycheecache: every run re-checks every link, so a
          # newly broken link can never be masked by a stale cached success.
          #
          # --remap: www.npmjs.com returns 403 to every non-browser user agent,
          # so the package pages are unverifiable as written. Check the
          # authoritative registry entry instead. Both packages are live
          # (@peerlytics/sdk, @usdctofiat/offramp) -- if this ever goes red the
          # package really is gone. Do not "fix" it by deleting the README links.
          #
          # --exclude linkedin.com: LinkedIn answers HTTP 999 (anti-bot) to any
          # non-browser client, browser user agent or not. Excluded by host so it
          # cannot produce a weekly false red; excluding one host is preferable to
          # loosening accepted status codes for every link.
          #
          # Also excluded by lychee itself, not by us:
          #   - twitter.com  -- built-in UNSUPPORTED_DOMAINS (requires an account)
          #   - mailto:      -- --include-mail is off by default
          # That leaves 27 of the README's 30 unique targets actually checked.
          args: >-
            --no-progress
            --verbose
            --max-retries 3
            --timeout 20
            --remap 'https://www.npmjs.com/package/(.*) https://registry.npmjs.org/$1'
            --exclude '^https://(www\.)?linkedin\.com/'
            README.md
