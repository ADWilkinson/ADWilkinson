name: link-check

# The profile README is this repository's only asset and its value is outbound-link
# reachability. This workflow is the regression guard: a red run means a real dead
# link, and the fix belongs in README.md, not in this config.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/link-check.yml
  pull_request:
    paths:
      - README.md
      - .github/workflows/link-check.yml
  schedule:
    # Weekly, Monday, deliberately off the top of the hour. GitHub delays
    # schedule events under load and documents the start of every hour as the
    # worst slot; a run delayed past its window is dropped, not queued.
    #
    # The original '0 7 * * 1' never delivered. On its first scheduled Monday
    # (2026-08-31) no scheduled run existed seven hours after it was due, while
    # a manual dispatch of this same workflow completed in 10s -- so the
    # workflow was healthy and only the trigger was lost. That is precisely the
    # silently skipped week the concurrency rule below also guards against.
    #
    # Keep the minute off :00 if this is ever retimed.
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.event_name }}-${{ github.ref }}
  # Only supersede in-flight PR runs. A push to main must never cancel the
  # weekly scan mid-flight: a cancelled run is neither red nor green, so the
  # weekly guarantee would silently skip a week.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # No --cache / .lycheecache: every run re-checks every link, so a
          # newly broken link can never be masked by a stale cached success.
          #
          # --remap: npmjs.com returns 403 to every non-browser user agent, so the
          # package pages are unverifiable as written. Check the authoritative
          # registry entry instead. The pattern covers the bare host as well as
          # www., because a bare-host link would otherwise bypass the remap and
          # go red on a 403 for a package that is perfectly alive. Both packages
          # are live (@peerlytics/sdk, @usdctofiat/offramp) -- if this goes red
          # the package really is gone. Do not "fix" it by deleting the links.
          #
          # --exclude linkedin.com: LinkedIn rate-limits non-browser clients
          # unpredictably. Ten identical probes from one host returned 200 eight
          # times, 999 once and 429 once, so this link cannot be checked without
          # generating false weekly reds. Excluded by host, which is preferable
          # to loosening accepted status codes for every link.
          #
          # Also excluded by lychee itself, not by us:
          #   - mailto:      -- --include-mail is off by default
          # That leaves 28 of the README's 30 unique targets actually checked.
          # x.com used to be twitter.com, which lychee skips via its built-in
          # UNSUPPORTED_DOMAINS. x.com is not on that list, so the profile link
          # is now genuinely checked: five identical probes returned 200 every
          # time. If it starts flapping, exclude it by host as above rather than
          # reverting to the twitter.com domain, which only 301s here anyway.
          #
          # Retries and timeout are deliberately above lychee's defaults (3 / 1s / 20s)
          # to absorb transient slowness rather than report it as link rot.
          args: >-
            --no-progress
            --verbose
            --max-retries 5
            --retry-wait-time 3
            --timeout 30
            --remap 'https://(www\.)?npmjs\.com/package/(.*) https://registry.npmjs.org/$2'
            --exclude '^https://(www\.)?linkedin\.com/'
            README.md
