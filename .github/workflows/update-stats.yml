name: Update profile stats

on:
  schedule:
    # 07:00 UTC on the 1st of every month
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution stats and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const login = context.repo.owner
            const year = new Date().getUTCFullYear()
            const from = `${year}-01-01T00:00:00Z`
            const to = `${year}-12-31T23:59:59Z`

            const query = `query($login: String!, $from: DateTime!, $to: DateTime!) {
              user(login: $login) {
                contributionsCollection(from: $from, to: $to) {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalPullRequestReviewContributions
                  totalIssueContributions
                }
              }
            }`

            const result = await github.graphql(query, { login, from, to })
            const c = result.user.contributionsCollection
            const fmt = (n) => n.toLocaleString('en-US')

            const line = `${fmt(c.totalCommitContributions)} commits · ${fmt(c.totalPullRequestContributions)} pull requests · ${fmt(c.totalPullRequestReviewContributions)} reviews · ${fmt(c.totalIssueContributions)} issues across agent tooling, ZKP2P ecosystem apps, trading systems, SDKs, and docs.`

            const readme = fs.readFileSync('README.md', 'utf8')
            const pattern = /(<!-- STATS:START -->)[\s\S]*?(<!-- STATS:END -->)/
            const updated = readme.replace(pattern, `$1\n${line}\n$2`)

            if (updated === readme) {
              core.info('STATS markers not found or content already in sync')
              return
            }
            fs.writeFileSync('README.md', updated)

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile stats [skip ci]"
          git push
